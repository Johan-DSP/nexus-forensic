services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus-backend
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/nexus.db
      STORAGE_PATH: /storage
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      MAX_UPLOAD_SIZE_MB: 100
    volumes:
      - nexus-data:/data
      - nexus-storage:/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: nexus-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexus-data:
  nexus-storage:
